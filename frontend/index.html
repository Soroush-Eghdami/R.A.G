<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Local RAG</title>
    <style>
      /* Paints the right background before the stylesheet arrives. */
      html {
        background: #f8fafc;
      }
      html.dark {
        background: #0b0f19;
      }
    </style>
    <script>
      // Apply the saved theme before React boots, so there is no flash.
      try {
        if (localStorage.getItem("rag.theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (error) {
        // Private mode or storage disabled: dark is the default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
